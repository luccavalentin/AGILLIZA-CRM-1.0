# Roteiro do vídeo para a revisão da Apple: Agilliza Correspondente.
# Abre o app, entra com a conta do revisor e percorre o uso típico (painel, simulações,
# propostas, clientes e chat com denúncia/bloqueio). Não cria, altera nem envia nada.
# Os textos vêm de src/routes/auth.tsx e src/components/app-shell/nav-config.ts.
# 3ª rodada (08/11): cada tela abre um tour ("1 de 6", Fechar o tour) que cobria o cabeçalho
# e parou a 2ª rodada; o roteiro fecha o tour e o aviso de cookies antes de seguir.
appId: br.com.agillizatech.correspondente
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Esqueci minha senha"
    timeout: 60000
- takeScreenshot: 01-entrar
- tapOn: "E-mail"
- inputText: ${REVISOR_EMAIL}
- tapOn: "Senha"
- inputText: ${REVISOR_SENHA}
- takeScreenshot: 02-preenchido
- tapOn:
    text: "Entrar"
    below: "Esqueci minha senha"
- extendedWaitUntil:
    visible: "Abrir menu de navegação"
    timeout: 60000
- tapOn:
    text: "Pular"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Fechar o tour"
    commands:
      - tapOn: "Fechar o tour"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Entendi"
    commands:
      - tapOn: "Entendi"
      - waitForAnimationToEnd
- takeScreenshot: 03-painel
- swipe:
    direction: UP
- waitForAnimationToEnd
- swipe:
    direction: DOWN

# Simulações
- scrollUntilVisible:
    element: "Abrir menu de navegação"
    direction: UP
    optional: true
# Espera a rolagem parar e tira o tour da frente antes de abrir o menu.
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Fechar o tour"
    commands:
      - tapOn: "Fechar o tour"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Entendi"
